name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build MkTeX.slnx -c Release -warnaserror
      - run: dotnet test tests/MkTeX.Tests -c Release --no-build
      - run: dotnet pack src/MkTeX -c Release --no-build -o artifacts
